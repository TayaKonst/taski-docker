volumes:
  pg_data_production:
  static_volume:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data

  backend:
    image: tayakonst/taski_backend
    env_file: .env
    volumes:
      - static_volume:/app/collected_static
    depends_on:
      - db

  frontend:
    image: tayakonst/taski_frontend
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static

  gateway:
    image: tayakonst/taski_gateway
    env_file: .env
    volumes:
      - static_volume:/staticfiles/
    ports:
      - 8080:80
    depends_on:
      - backend
